<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ role_label }} — ATS Operations</title>
    {% if pwa_capable %}
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0b4263">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="ATS Ops">
    {% endif %}
</head>
<body>
    <h1>{{ role_label }} Home</h1>
    <p>Welcome, {{ user.email }}. This is the {{ role_label }} placeholder page.</p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Logout</button>
    </form>
    {% if pwa_capable %}
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/service-worker.js');
        }
    </script>
    {% endif %}
</body>
</html>
