<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Enviar PDF — NIR — ATS Operations</title>
</head>
<body>
    <h1>Enviar Encaminhamento</h1>
    <p>Upload do PDF de encaminhamento para triagem.</p>

    {% if error_message %}
    <p class="error">{{ error_message }}</p>
    {% endif %}

    <form method="post" action="{% url 'nir_upload_submit' %}" enctype="multipart/form-data">
        {% csrf_token %}
        <label for="pdf_file">Arquivo PDF</label>
        <input type="file" name="pdf_file" id="pdf_file" accept=".pdf,application/pdf" required>
        <button type="submit">Enviar</button>
    </form>

    <p><a href="{% url 'nir_home' %}">Voltar</a></p>
</body>
</html>
