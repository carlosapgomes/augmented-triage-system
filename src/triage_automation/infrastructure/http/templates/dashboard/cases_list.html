{% extends "dashboard/base.html" %}

{% block content %}
  <style>
    @media (max-width: 767.98px) {
      #cases-list-fragment .cases-list-table thead {
        display: none;
      }

      #cases-list-fragment .cases-list-table,
      #cases-list-fragment .cases-list-table tbody,
      #cases-list-fragment .cases-list-table tr,
      #cases-list-fragment .cases-list-table td {
        display: block;
        width: 100%;
      }

      #cases-list-fragment .cases-list-table tr {
        margin-bottom: 0.75rem;
        border: 1px solid var(--hospital-border);
        border-radius: 0.75rem;
        background: var(--hospital-surface);
      }

      #cases-list-fragment .cases-list-table td {
        border: 0;
        padding: 0.45rem 0.75rem;
        font-size: 0.95rem;
      }

      #cases-list-fragment .cases-list-table td::before {
        content: attr(data-mobile-label);
        display: block;
        margin-bottom: 0.2rem;
        color: var(--hospital-muted);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #cases-list-fragment .cases-list-table td[data-mobile-label="Caso"] a {
        font-size: 1rem;
        font-weight: 600;
      }

      #cases-list-fragment #cases-search-totals .list-inline-item {
        display: block;
        margin-right: 0 !important;
        margin-bottom: 0.25rem;
      }

      #cases-filter-form .cases-touch-control {
        min-height: 44px;
        font-size: 1rem;
      }

      #cases-filter-form .cases-touch-button {
        min-height: 44px;
        font-size: 1rem;
        font-weight: 600;
      }

      #cases-list-fragment .cases-search-totals-list .list-inline-item {
        padding: 0.1rem 0;
      }

      #cases-list-fragment .cases-pagination {
        flex-wrap: wrap;
        row-gap: 0.4rem;
      }

      #cases-list-fragment .cases-touch-page-link {
        min-width: 44px;
        min-height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }
  </style>

  <section class="card shadow-sm mb-4">
    <div class="card-body">
      <h2 class="h5 mb-3">Casos</h2>
      <form
        id="cases-filter-form"
        class="row g-2 g-md-3 align-items-end cases-filter-form"
        method="get"
        action="/dashboard/cases"
        up-target="#cases-list-fragment"
        up-push-url="true"
      >
        <div class="col-12 col-md-3">
          <label class="form-label" for="status">Status</label>
          <select class="form-select cases-touch-control" id="status" name="status">
            <option value="">Todos</option>
            {% for option in status_options %}
              <option value="{{ option }}" {% if filters.status == option %}selected{% endif %}>
                {{ option }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="from_date">De</label>
          <input
            class="form-control cases-touch-control"
            id="from_date"
            name="from_date"
            type="date"
            value="{{ filters.from_date }}"
          >
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="to_date">Ate</label>
          <input
            class="form-control cases-touch-control"
            id="to_date"
            name="to_date"
            type="date"
            value="{{ filters.to_date }}"
          >
        </div>
        <input type="hidden" name="page" value="1">
        <input type="hidden" name="page_size" value="{{ filters.page_size }}">
        <input type="hidden" id="tz_offset" name="tz_offset" value="{{ filters.tz_offset | default('0') }}">
        <div class="col-12 col-md-3">
          <button class="btn btn-primary w-100 cases-touch-button" type="submit">Aplicar filtros</button>
        </div>
      </form>
    </div>
  </section>
  {% include "dashboard/partials/cases_list_fragment.html" %}

  <script>
    (function () {
      var form = document.getElementById('cases-filter-form');
      var fromDateInput = document.getElementById('from_date');
      var toDateInput = document.getElementById('to_date');
      var tzOffsetInput = document.getElementById('tz_offset');

      function getTodayDate() {
        var today = new Date();
        var year = today.getFullYear();
        var month = String(today.getMonth() + 1).padStart(2, '0');
        var day = String(today.getDate()).padStart(2, '0');
        return year + '-' + month + '-' + day;
      }

      function getBrowserTzOffset() {
        // getTimezoneOffset returns the difference in minutes between UTC and local time.
        // For UTC-3, it returns 180. We want to send -180 to indicate "3 hours behind UTC".
        return -new Date().getTimezoneOffset();
      }

      function setDefaultDates() {
        var today = getTodayDate();
        if (fromDateInput && !fromDateInput.value) {
          fromDateInput.value = today;
        }
        if (toDateInput && !toDateInput.value) {
          toDateInput.value = today;
        }
      }

      function setTzOffset() {
        // Always update the tz_offset to the browser's current offset
        if (tzOffsetInput) {
          tzOffsetInput.value = getBrowserTzOffset();
        }
      }

      function validateDates(event) {
        if (!fromDateInput.value || !toDateInput.value) {
          event.preventDefault();
          event.stopPropagation();
          alert('Por favor, preencha os campos de data (De e Ate) antes de filtrar.');
          return false;
        }
        return true;
      }

      // Set default dates and timezone offset on initial page load
      setDefaultDates();
      setTzOffset();

      // Validate on form submit
      form.addEventListener('submit', validateDates);

      // Also validate on Unpoly submissions
      up.on('up:form:submit', function (event) {
        if (event.target.id === 'cases-filter-form') {
          if (!validateDates(event)) {
            event.preventDefault();
          }
        }
      });

      // Re-set default dates and tz_offset after Unpoly fragment updates
      up.on('up:fragment:inserted', function (event) {
        if (event.target.querySelector && event.target.querySelector('#cases-filter-form')) {
          fromDateInput = document.getElementById('from_date');
          toDateInput = document.getElementById('to_date');
          tzOffsetInput = document.getElementById('tz_offset');
          form = document.getElementById('cases-filter-form');
          setDefaultDates();
          setTzOffset();
        }
      });
    })();
  </script>
{% endblock %}
